[BASE]
ROOT_DIR = .
CHAMPSIM_DIR = %(ROOT_DIR)s/ChampSim
TRACE_DIR = %(ROOT_DIR)s/traces
DUMP_DIR = %(ROOT_DIR)s/data
STATS_DIR = %(ROOT_DIR)s/stats
FIGURES_DIR = %(ROOT_DIR)s/figures 

[SIMULATION]
warmup_instructions = 50000000
run_instructions = 100000000
time = 02:00:00
batch_size = 5

[PARSING]
parse_raw_stats = true
parse_reuse_distance_stats = false

[PLOTTING]
plot_name = access_freq_range0_size_analysis
plot_type = plot_ipc
file_type = pdf
alternative_tags = BASELINE, 4KB, 8KB, 16KB, 32KB, 64KB, 128KB, 256KB, 512KB, 1MB, 2MB

[EXPERIMENT]
#name = access_freq_size_analysis_l1
#name = access_freq_size_analysis_l2
#name = access_freq_size_analysis_l3
# freq ranges
#name = access_freq_range_size_analysis_l1
name = access_freq_range0_size_analysis_l2
#name = access_freq_range_size_analysis_l3
workload = selected_qualcomm_srv_ap
#workload = google_srv
debug_run = false
parallel_run = true
simulations_base = BASELINE
simulations_4KB_base = TXVC-4KB
simulations_4KB_freq = TXVC-4KB_MFU-FREQ-${txvc.filter_frequency_threshold}
simulations_32KB_base = TXVC-32KB
simulations_32KB_freq = TXVC-32KB_MFU-FREQ-${txvc.filter_frequency_threshold}
simulations_Inf_l1d_freq = TXVC-SETS-1-WAYS-${txvc.ways}-L1D
simulations_Inf_l2c_freq = TXVC-SETS-1-WAYS-${txvc.ways}-L2C
simulations_Inf_llc_freq = TXVC-SETS-1-WAYS-${txvc.ways}-LLC
#simulations = BASELINE, %(simulations_Inf_l1d_freq)s
simulations = BASELINE, %(simulations_Inf_l2c_freq)s
#simulations = BASELINE, %(simulations_Inf_llc_freq)s
#simulations = BASELINE, %(simulations_32KB_freq)s, %(simulations_4KB_freq)s

[BASELINE]
skip_simulation = true
simulation_stats = ./stats/txvc_base_eval/BASELINE/selected_qualcomm_srv_ap_BASELINE.csv
ooo_cpu.instruction_prefetcher = fdip
llc.sets = 1537
llc.ways = 16

[TXVC-SETS-1-WAYS-${txvc.ways}-L1D]
ooo_cpu.instruction_prefetcher = fdip
llc.sets = 1537
llc.ways = 16
ooo_cpu.enable_txvc = true
txvc.level = 1
txvc.sets = 1
txvc.ways = 64 128 256 512 1024 2048 4096 8192 16384 32768 
txvc.cache_filtering = true
txvc.cache_filter = oracle-mfu
txvc.filter_mem_trace_path = ./data/txvc_l1d_traces
txvc.filter_frequency_threshold = 100

[TXVC-SETS-1-WAYS-${txvc.ways}-L2C]
ooo_cpu.instruction_prefetcher = fdip
llc.sets = 1537
llc.ways = 16
ooo_cpu.enable_txvc = true
txvc.level = 2
txvc.sets = 1
txvc.ways = 64 128 256 512 1024 2048 4096 8192 16384 32768 
txvc.cache_filtering = true
txvc.cache_filter = oracle-mfu
txvc.filter_mem_trace_path = ./data/txvc_l2c_traces
range0 = 2-999999
range1 = 5-999999
range2 = 10-999999
range3 = 40-999999
range4 = 100-999999
txvc.filter_frequency_threshold = %(range0)s

[TXVC-SETS-1-WAYS-${txvc.ways}-LLC]
ooo_cpu.instruction_prefetcher = fdip
llc.sets = 1537
llc.ways = 16
ooo_cpu.enable_txvc = true
txvc.level = 3
txvc.sets = 1
txvc.ways = 64 128 256 512 1024 2048 4096 8192 16384 32768 
txvc.cache_filtering = true
txvc.cache_filter = oracle-mfu
txvc.filter_mem_trace_path = ./data/txvc_llc_traces
txvc.filter_frequency_threshold = 500-999999