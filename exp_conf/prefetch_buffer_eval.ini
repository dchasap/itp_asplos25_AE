[BASE]
ROOT_DIR = .
CHAMPSIM_DIR = %(ROOT_DIR)s/ChampSim
TRACE_DIR = %(ROOT_DIR)s/traces
DUMP_DIR = %(ROOT_DIR)s/data
STATS_DIR = %(ROOT_DIR)s/stats
FIGURES_DIR = %(ROOT_DIR)s/figures 
SLIDES_DIR = %(ROOT_DIR)s/slides

[SIMULATION]
warmup_instructions = 50000000
run_instructions = 100000000
time = 02:00:00
batch_size = 20

[PARSING]
parse_raw_stats = true
parse_reuse_distance_stats = false

[PLOTTING]
plot_name = prefetch_buffer_eval
plot_type = ipc, txvc_prefetcher_survivability, txvc_prefetch_failure_split, txvc_prefetch_funnel
file_type = png
alternative_tags = BASELINE, SBLG-PF, CHILD-PF


[EXPERIMENT]
name = prefetch_buffer_eval
workload = selected_qualcomm_srv_ap
#workload = google_srv
#workload = spec_cpu_2017
#workload = gapp
#workload = debug
#workload = test
debug_run = false
parallel_run = true
simulations_base = BASELINE
simulations_sblg_pf = sblgpf_gate-${l2c.pf_mshr_gate_pct}_thld-${l2c.pf_sblg_conf_threshold}_tblsz-${l2c.pf_sblg_table_size}_accwindow-${l2c.pf_sblg_acc_window}_acc_threshold-${l2c.pf_sblg_acc_threshold}_degree-${l2c.pf_sblg_degree}_pfbuffer-${l2c.pf_buffer.cache}
simulations_child_pf = childpf_gate-${l2c.pf_mshr_gate_pct}_thld-${l2c.pf_child_conf_threshold}_tblsz-${l2c.pf_child_table_size}_pendingsz-${l2c.pf_child_pending_size}_trainonhit-${l2c.pf_child_train_on_hit}_pfbuffer-${l2c.pf_buffer.cache}
# SIMULATIONS TO ACTUALLY RUN
simulations = %(simulations_base)s, %(simulations_sblg_pf)s, %(simulations_child_pf)s

[BASELINE]
#skip_simulation = true
ooo_cpu.instruction_prefetcher = fdip
l2c.sets = 2048
l2c.ways = 8
l2c.prefetcher = no
llc.sets = 1024
llc.ways = 16

[sblgpf_gate-${l2c.pf_mshr_gate_pct}_thld-${l2c.pf_sblg_conf_threshold}_tblsz-${l2c.pf_sblg_table_size}_accwindow-${l2c.pf_sblg_acc_window}_acc_threshold-${l2c.pf_sblg_acc_threshold}_degree-${l2c.pf_sblg_degree}_pfbuffer-${l2c.pf_buffer.cache}]
#skip_simulation = true
ooo_cpu.instruction_prefetcher = fdip
l2c.sets = 2048
l2c.ways = 8
l2c.prefetch_activate = LOAD,PREFETCH,TRANSLATION
l2c.prefetcher = tx_sibling
l2c.pf_mshr_gate_pct = 75
l2c.pf_sblg_conf_threshold = 1
l2c.pf_sblg_table_size = 65536
l2c.pf_sblg_acc_window = 32
l2c.pf_sblg_acc_threshold = 0
l2c.pf_sblg_degree = 1
l2c.pf_buffer.cache = L2C
llc.sets = 1024
llc.ways = 16

[childpf_gate-${l2c.pf_mshr_gate_pct}_thld-${l2c.pf_child_conf_threshold}_tblsz-${l2c.pf_child_table_size}_pendingsz-${l2c.pf_child_pending_size}_trainonhit-${l2c.pf_child_train_on_hit}_pfbuffer-${l2c.pf_buffer.cache}]
#skip_simulation = true
ooo_cpu.instruction_prefetcher = fdip
l2c.sets = 2048
l2c.ways = 8
l2c.prefetch_activate = LOAD,PREFETCH,TRANSLATION
l2c.prefetcher = tx_child
l2c.pf_mshr_gate_pct = 75
l2c.pf_child_conf_threshold = 1
l2c.pf_child_table_size = 65536
l2c.pf_child_pending_size = 65536
l2c.pf_child_train_on_hit = 1
l2c.pf_buffer.cache = L2C
llc.sets = 1024
llc.ways = 16
