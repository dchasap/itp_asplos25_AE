[BASE]
root_dir = ./
champsim_dir = %(ROOT_DIR)s/ChampSim
trace_dir = %(ROOT_DIR)s/traces
dump_dir = %(ROOT_DIR)s/data
stats_dir = %(ROOT_DIR)s/stats
figures_dir = %(ROOT_DIR)s/figures

[SIMULATION]
warmup_instructions = 500000 # 50000000
run_instructions = 1000000 # 100000000
time = 00:00:30 #04:00:00
batch_size = 5

[PARSING]
parse_raw_stats = true
parse_reuse_distance_stats = false

[PLOTTING]
plot_name = fig_32KB
plot_type = plot_ipc
file_type = pdf

[EXPERIMENT]
name = test
workload = debug
simulations = test, test-cntr-size-5-bias-true, test-cntr-size-4-bias-true, test-cntr-size-3-bias-true, test-cntr-size-2-bias-true, test-cntr-size-5-bias-false, test-cntr-size-4-bias-false, test-cntr-size-3-bias-false, test-cntr-size-2-bias-false, test-filter-oracle-doa, test-filter-doa
debug_run = true
parallel_run = true

[test]
ooo_cpu.instruction_prefetcher = fdip
llc.sets = 1537
llc.ways = 16
ooo_cpu.enable_txvc = false

[test-cntr-size-2-bias-true]
ooo_cpu.instruction_prefetcher = fdip
llc.sets = 1537
llc.ways = 16
ooo_cpu.enable_txvc = true
txvc.sets = 1
txvc.ways = 64
txvc.cache_filtering = true
txvc.cache_filter = doa
txvc.dbpred_cntr_size = 2
txvc.dbpred_use_bias = true

