[BASE]
root_dir = .
champsim_dir = %(ROOT_DIR)s/ChampSim
trace_dir = %(ROOT_DIR)s/traces
dump_dir = %(ROOT_DIR)s/data
stats_dir = %(ROOT_DIR)s/stats
figures_dir = %(ROOT_DIR)s/figures

[SIMULATION]
warmup_instructions = 50000000
run_instructions = 100000000
time = 02:00:00
batch_size = 10

[PARSING]
parse_raw_stats = true
parse_reuse_distance_stats = false

[PLOTTING]
plot_name = fig_doa_oracle_eval
plot_type = plot_ipc
file_type = pdf

[EXPERIMENT]
name = doa_oracle_eval
workload = selected_qualcomm_srv_ap
debug_run = false
parallel_run = true
simulations_base = BASELINE
simulations_4kb_base = TXVC-4KB
simulations_32kb_base = TXVC-32KB
simulations_4kb_doa = TXVC-4KB_DOA-NAIVE, TXVC-4KB_DOA-ORACLE
simulations_32kb_doa = TXVC-32KB_DOA-NAIVE, TXVC-32KB_DOA-ORACLE
simulations = BASELINE, TXVC-4KB, TXVC-4KB_DOA-NAIVE, TXVC-4KB_DOA-ORACLE, TXVC-32KB, TXVC-32KB_DOA-NAIVE, TXVC-32KB_DOA-ORACLE

[BASELINE]
skip_simulation = true
simulation_stats = ./stats/txvc_base_eval/BASELINE/selected_qualcomm_srv_ap_BASELINE.csv
ooo_cpu.instruction_prefetcher = fdip
llc.sets = 1537
llc.ways = 16

[TXCV-INF]
skip_simulation = true
simulation_stats = ./stats/txvc_base_eval/BASELINE/selected_qualcomm_srv_ap_TXVC-Inf.csv
ooo_cpu.instruction_prefetcher = fdip
llc.sets = 1537
llc.ways = 16
ooo_cpu.enable_txvc = true
txvc.sets = 20480
txvc.ways = 8
txvc.doa_filtering = false

[TXVC-4KB]
ooo_cpu.instruction_prefetcher = fdip
llc.sets = 1537
llc.ways = 16
ooo_cpu.enable_txvc = true
txvc.sets = 1
txvc.ways = 64
txvc.cache_filtering = false

[TXVC-4KB_DOA-NAIVE]
ooo_cpu.instruction_prefetcher = fdip
llc.sets = 1537
llc.ways = 16
ooo_cpu.enable_txvc = true
txvc.sets = 1
txvc.ways = 64
txvc.cache_filtering = true
txvc.cache_filter = doa-simple

[TXVC-4KB_DOA-ORACLE]
ooo_cpu.instruction_prefetcher = fdip
llc.sets = 1537
llc.ways = 16
ooo_cpu.enable_txvc = true
txvc.sets = 1
txvc.ways = 64
txvc.cache_filtering = true
txvc.cache_filter = oracle-doa
txvc.filter_mem_trace_path = ./data

[TXVC-32KB]
ooo_cpu.instruction_prefetcher = fdip
llc.sets = 1537
llc.ways = 16
ooo_cpu.enable_txvc = true
txvc.sets = 64
txvc.ways = 8
txvc.cache_filtering = false

[TXVC-32KB_DOA-NAIVE]
ooo_cpu.instruction_prefetcher = fdip
llc.sets = 1537
llc.ways = 16
ooo_cpu.enable_txvc = true
txvc.sets = 64
txvc.ways = 8
txvc.cache_filtering = true
txvc.cache_filter = doa-simple

[TXVC-32KB_DOA-ORACLE]
ooo_cpu.instruction_prefetcher = fdip
llc.sets = 1537
llc.ways = 16
ooo_cpu.enable_txvc = true
txvc.sets = 64
txvc.ways = 8
txvc.cache_filtering = true
txvc.cache_filter = oracle-doa
txvc.filter_mem_trace_path = ./data

