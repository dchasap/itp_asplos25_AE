# TODO: add preprocessor to make conf files more versatile 
[BASE]
ROOT_DIR = ./
CHAMPSIM_DIR = %(ROOT_DIR)s/ChampSim
TRACE_DIR = %(ROOT_DIR)s/traces
DUMP_DIR = %(ROOT_DIR)s/data
STATS_DIR = %(ROOT_DIR)s/stats
FIGURES_DIR = %(ROOT_DIR)s/figures 

[SIMULATION]
warmup_instructions = 500000 # 50000000
run_instructions = 1000000 # 100000000
time = 00:00:30 #04:00:00
batch_size = 5

[PARSING]
parse_raw_stats = true
parse_reuse_distance_stats = false

[PLOTTING]
plot_name = fig_32KB
plot_type = plot_ipc 
# TODO: plot multiple types
file_type = pdf

# TODO: add aliasing for tag names
# alternative_tags= ...Alternative names for sim, should match order and...
# TODO: some way we should manage and assign baselines

[EXPERIMENT]
name = test
workload = debug
#simulations = BASELINE, TXVC-32KB, TXVC-32KB-DOA-OLD, TXVC-32KB-DOA-CNTR_SZ-1, TXVC-32KB-DOA-CNTR_SZ-2, TXVC-32KB-DOA-CNTR_SZ-3, TXVC-32KB-DOA-CNTR_SZ-4, TXVC-32KB-DOA-CNTR_SZ-5
simulations = test, test-cntr-size-${txvc.dbpred_cntr_size}-bias-${txvc.dbpred_use_bias}, test-filter-${txvc.cache_filter}
debug_run = true
parallel_run = true
# TODO automate experiment generation
# component.parameter1 = x y z
# component.parameter2 = a b c
# tag_template = TXVC-${component.parameter1}-${component.parameter2}

[test]
ooo_cpu.instruction_prefetcher = fdip
llc.sets = 1537
llc.ways = 16
ooo_cpu.enable_txvc = false 

[test-cntr-size-${txvc.dbpred_cntr_size}-bias-${txvc.dbpred_use_bias}]
ooo_cpu.instruction_prefetcher = fdip
llc.sets = 1537
llc.ways = 16
ooo_cpu.enable_txvc = true
txvc.sets = 1
txvc.ways = 64
txvc.cache_filtering = true
txvc.cache_filter = doa
txvc.dbpred_cntr_size = 2 3 4 5
txvc.dbpred_use_bias = false true

[test-filter-${txvc.cache_filter}]
ooo_cpu.instruction_prefetcher = fdip
llc.sets = 1537
llc.ways = 16
ooo_cpu.enable_txvc = true
txvc.sets = 1
txvc.ways = 64
txvc.cache_filtering = true
txvc.cache_filter = doa oracle-doa
