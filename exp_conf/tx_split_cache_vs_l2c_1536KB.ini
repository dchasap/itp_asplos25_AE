[BASE]
ROOT_DIR = .
CHAMPSIM_DIR = %(ROOT_DIR)s/ChampSim
TRACE_DIR = %(ROOT_DIR)s/traces
DUMP_DIR = %(ROOT_DIR)s/data
STATS_DIR = %(ROOT_DIR)s/stats
FIGURES_DIR = %(ROOT_DIR)s/figures 
SLIDES_DIR = %(ROOT_DIR)s/slides

[SIMULATION]
warmup_instructions = 50000000
run_instructions = 100000000
time = 02:00:00
batch_size = 5

[PARSING]
parse_raw_stats = true
parse_reuse_distance_stats = false

[PLOTTING]
plot_name = tx-sets_vs_l2c_1536KB_budget_analysis
plot_type = plot_ipc
#plot_type = plot_mpki
file_type = pdf
alternative_tags = BASELINE, TX-SETS:32KB, TX-SETS:64KB, TX-SETS:128KB, TX-SETS:256KB

[EXPERIMENT]
name = tx-sets_vs_l2c_llc-1MB_budget_analysis
workload = selected_qualcomm_srv_ap
#workload = google_srv
#workload = debug
debug_run = false
parallel_run = true
simulations_base_l2c_1536KB = BASELINE-L2C-1536KB
simulations_l2c_1536KB_tx-sets= L2C-1536-TX-SETS-${tx.sets}

# SIMULATIONS TO ACTUALLY RUN
#simulations = %(simulations_base_l2c_1536KB)s
simulations = %(simulations_base_l2c_1536KB)s, %(simulations_l2c_1536KB_tx-sets)s
#simulations = %(simulations_l2c_1536KB_tx-sets)s

[BASELINE-L2C-1536KB]
#skip_simulation = true
#simulation_stats = ./stats/txvc_vs_l2c_budget_analysis/BASELINE-L2C-1536KB
ooo_cpu.instruction_prefetcher = fdip
l2c.sets = 3072
l2c.ways = 8
llc.sets = 1024
llc.ways = 16

[L2C-1536-TX-SETS-${tx.sets}]
ooo_cpu.instruction_prefetcher = fdip
l2c.sets = 3072
l2c.ways = 8
llc.sets = 1024
llc.ways = 16
tx.level = 2
tx.sets = 64 128 256 512

