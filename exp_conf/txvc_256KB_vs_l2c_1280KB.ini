[BASE]
ROOT_DIR = .
CHAMPSIM_DIR = %(ROOT_DIR)s/ChampSim
TRACE_DIR = %(ROOT_DIR)s/traces
DUMP_DIR = %(ROOT_DIR)s/data
STATS_DIR = %(ROOT_DIR)s/stats
FIGURES_DIR = %(ROOT_DIR)s/figures 
SLIDES_DIR = %(ROOT_DIR)s/slides

[SIMULATION]
warmup_instructions = 50000000
run_instructions = 100000000
time = 02:00:00
batch_size = 5

[PARSING]
parse_raw_stats = true
parse_reuse_distance_stats = false

[PLOTTING]
plot_name = txvc_256KB_vs_l2c_1280KB_budget_analysis3
plot_type = plot_ipc
#plot_type = plot_mpki
file_type = pdf
#alternative_tags = BASELINE, TXVC, TXVC-FreqFilter

[EXPERIMENT]
name = txvc_vs_l2c_budget_analysis
workload = selected_qualcomm_srv_ap
#workload = google_srv
#workload = debug
debug_run = false
parallel_run = true
# 256KB TXVC vs 1280KB L2C
simulations_base_l2c_1280KB = BASELINE-L2C-1280KB
simulations_rep_l2c_1280KB = iTP-L2C-1280KB, xPTP-L2C-1280KB, iTP+xPTP-L2C-1280KB
simulations_l2c_1024KB_txvc_256KB = L2C-1024KB-TXVC-256KB-FILTER-${txvc.cache_filter}
simulations_rep_l2c_1024KB_txvc_256KB = iTP+xPTP-L2C-1024KB-TXVC-256KB-FILTER-${txvc.cache_filter}
simulations_l2c_768KB_txvc_256KB = L2C-768KB-TXVC-256KB-FILTER-${txvc.cache_filter}

# SIMULATIONS TO ACTUALLY RUN
#simulations = %(simulations_base_l2c_1280KB)s, %(simulations_rep_l2c_1280KB)s, %(simulations_l2c_1024KB_txvc_256KB)s, %(simulations_l2c_1280KB_txvc_256KB)s
simulations = BASELINE-L2C-1024KB, %(simulations_l2c_768KB_txvc_256KB)s 
#, %(simulations_rep_l2c_1024KB_txvc_256KB)s

# 256KB TXVC vs 1280KB L2C
[BASELINE-L2C-1280KB]
#skip_simulation = true
#simulation_stats = ./stats/txvc_base_eval/BASELINE/
ooo_cpu.instruction_prefetcher = fdip
l2c.sets = 2560
l2c.ways = 8
llc.sets = 1537
llc.ways = 16

# 256KB TXVC vs 1280KB L2C
[BASELINE-L2C-1024KB]
#skip_simulation = true
#simulation_stats = ./stats/txvc_base_eval/BASELINE/
ooo_cpu.instruction_prefetcher = fdip
l2c.sets = 2048
l2c.ways = 8
llc.sets = 1537
llc.ways = 16

[iTP-L2C-1280KB]
ooo_cpu.instruction_prefetcher = fdip
stlb.replacement = itp
l2c.sets = 2560
l2c.ways = 8
llc.sets = 1537
llc.ways = 16

[xPTP-L2C-1280KB]
ooo_cpu.instruction_prefetcher = fdip
l2c.sets = 2560
l2c.ways = 8
l2c.replacement = xptp
llc.sets = 1537
llc.ways = 16

[iTP+xPTP-L2C-1280KB]
ooo_cpu.instruction_prefetcher = fdip
stlb.replacement = itp
l2c.sets = 2560
l2c.ways = 8
l2c.replacement = xptp
llc.sets = 1537
llc.ways = 16


[L2C-1024KB-TXVC-256KB-FILTER-${txvc.cache_filter}]
ooo_cpu.instruction_prefetcher = fdip
l2c.sets = 2048
l2c.ways = 8
llc.sets = 1537
llc.ways = 16
ooo_cpu.enable_txvc = true
txvc.level = 2
txvc.sets = 1
txvc.ways = 4096
txvc.cache_filtering = true
txvc.cache_filter = none freq-filter
txvc.filter_mem_trace_path = ./data/txvc_l2c_traces
txvc.filter_frequency_threshold = 2
txvc.replacement = lfu

[L2C-1280KB-TXVC-256KB-FILTER-${txvc.cache_filter}]
ooo_cpu.instruction_prefetcher = fdip
l2c.sets = 2560
l2c.ways = 8
llc.sets = 1537
llc.ways = 16
ooo_cpu.enable_txvc = true
txvc.level = 2
txvc.sets = 1
txvc.ways = 4096
txvc.cache_filtering = true
txvc.cache_filter = none freq-filter
txvc.filter_mem_trace_path = ./data/txvc_l2c_traces
txvc.filter_frequency_threshold = 2
txvc.replacement = lfu

[L2C-768KB-TXVC-256KB-FILTER-${txvc.cache_filter}]
ooo_cpu.instruction_prefetcher = fdip
l2c.sets = 1536
l2c.ways = 8
llc.sets = 1537
llc.ways = 16
ooo_cpu.enable_txvc = true
txvc.level = 2
txvc.sets = 1
txvc.ways = 4096
txvc.cache_filtering = true
txvc.cache_filter = none freq-filter
txvc.filter_mem_trace_path = ./data/txvc_l2c_traces
txvc.filter_frequency_threshold = 2
txvc.replacement = lfu

[iTP+xPTP-L2C-1024KB-TXVC-256KB-FILTER-${txvc.cache_filter}]
ooo_cpu.instruction_prefetcher = fdip
l1d.replacement = itp
l2c.sets = 2048
l2c.ways = 8
l2c.replacement = xptp
llc.sets = 1537
llc.ways = 16
ooo_cpu.enable_txvc = true
txvc.level = 2
txvc.sets = 1
txvc.ways = 4096
txvc.cache_filtering = true
txvc.cache_filter = none freq-filter
txvc.filter_mem_trace_path = ./data/txvc_l2c_traces
txvc.filter_frequency_threshold = 2
txvc.replacement = lfu