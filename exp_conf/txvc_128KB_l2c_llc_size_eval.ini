# SIMULATIONS TO ACTUALLY RUN
simulations = %(simulations_base)s, %(simulations_txvc)s
#simulations = TXVC-128KB-L2C-${l2c.sets}-${l2c.ways}-LLC-${llc.sets}-${llc.ways}-FILTER-${txvc.cache_filter}

[BASELINE-L2C-${l2c.sets}-${l2c.ways}-LLC-${llc.sets}-${llc.ways}]
ooo_cpu.instruction_prefetcher = fdip
#l2c.sets = 4096
l2c.sets = 2048 2560 3072 3584 4096
l2c.ways = 8
llc.sets = 1024 1280 1536 1792 2048
#llc.sets = 2048 
llc.ways = 16

[TXVC-128KB-L2C-${l2c.sets}-${l2c.ways}-LLC-${llc.sets}-${llc.ways}-FILTER-${txvc.cache_filter}]
ooo_cpu.instruction_prefetcher = fdip
l2c.sets = 2048 2560 3072 3584 4096
#l2c.sets = 4096
l2c.ways = 8
llc.sets = 1024 1280 1536 1792 2048
#llc.sets = 2048
llc.ways = 16
ooo_cpu.enable_txvc = true
txvc.level = 2
txvc.sets = 2048
txvc.ways = 1
txvc.cache_filtering = true
txvc.cache_filter = freq-filter
txvc.filter_mem_trace_path = ./data/txvc_l2c_traces
txvc.filter_frequency_threshold = 2
txvc.replacement = lfu
