[EXPERIMENT]
#name = txvc_l2c_llc_size_eval
name = txvc_128KB_l2c_llc_size_eval_freq-filter
#workload = qualcomm_srv_ap
#workload = selected_qualcomm_srv_ap
workload = smt_qualcomm_srv_ap
#workload = google_srv
#workload = spec_cpu_2017
#workload = gapp
#workload = debug
debug_run = false
parallel_run = true
simulations_base = BASELINE-L2C-${l2c.sets}-${l2c.ways}-LLC-${llc.sets}-${llc.ways}
