[BASE]
ROOT_DIR = .
CHAMPSIM_DIR = %(ROOT_DIR)s/ChampSim
TRACE_DIR = %(ROOT_DIR)s/traces
DUMP_DIR = %(ROOT_DIR)s/data
STATS_DIR = %(ROOT_DIR)s/stats
FIGURES_DIR = %(ROOT_DIR)s/figures 
SLIDES_DIR = %(ROOT_DIR)s/slides

[SIMULATION]
warmup_instructions = 50000000
run_instructions = 100000000
time = 02:00:00
batch_size = 5

[PARSING]
parse_raw_stats = true
parse_reuse_distance_stats = false

[PLOTTING]
plot_name = txvc_128KB_vs_l2c_1536KB_budget_analysis2
#plot_type = plot_ipc
plot_type = plot_mpki
file_type = pdf
#alternative_tags = BASELINE, TXVC, TXVC-FreqFilter

[EXPERIMENT]
name = txvc_vs_l2c_budget_analysis
workload = selected_qualcomm_srv_ap
#workload = google_srv
#workload = debug
debug_run = true
parallel_run = true
# 32KB TXVC vs 1536KB L2C
simulations_base_l2c_1536KB = BASELINE-L2C-1536KB
simulations_rep_l2c_1536KB = iTP-L2C-1536KB, xPTP-L2C-1536KB, iTP+xPTP-L2C-1536KB
simulations_l2c_1408KB_txvc_128KB = L2C-1408KB-TXVC-128KB-FILTER-${txvc.cache_filter}

# SIMULATIONS TO ACTUALLY RUN
simulations = %(simulations_base_l2c_1536KB)s, %(simulations_l2c_1408KB_txvc_128KB)s
#simulations = %(simulations_base_l2c_1536KB)s

[BASELINE-L2C-1536KB]
#skip_simulation = true
#simulation_stats = ./stats/txvc_vs_l2c_budget_analysis/BASELINE-L2C-1536KB
ooo_cpu.instruction_prefetcher = fdip
l2c.sets = 3072
l2c.ways = 8
llc.sets = 1024
llc.ways = 16

[iTP-L2C-1536KB]
ooo_cpu.instruction_prefetcher = fdip
stlb.replacement = itp
l2c.sets = 3072
l2c.ways = 8
llc.sets = 1024
llc.ways = 16

[xPTP-L2C-1536KB]
ooo_cpu.instruction_prefetcher = fdip
l2c.sets = 3072
l2c.ways = 8
l2c.replacement = xptp
llc.sets = 1024
llc.ways = 16

[iTP+xPTP-L2C-1536KB]
ooo_cpu.instruction_prefetcher = fdip
stlb.replacement = itp
l2c.sets = 3072
l2c.ways = 8
l2c.replacement = xptp
llc.sets = 1024
llc.ways = 16


[L2C-1408KB-TXVC-128KB-FILTER-${txvc.cache_filter}]
ooo_cpu.instruction_prefetcher = fdip
l2c.sets = 2816
l2c.ways = 8
llc.sets = 1024
llc.ways = 16
ooo_cpu.enable_txvc = true
txvc.level = 2
txvc.sets = 1
txvc.ways = 1536
txvc.cache_filtering = true
txvc.cache_filter = none freq-filter
txvc.filter_mem_trace_path = ./data/txvc_l2c_traces
txvc.filter_frequency_threshold = 2
txvc.replacement = lfu
