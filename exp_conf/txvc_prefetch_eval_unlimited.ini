[BASE]
ROOT_DIR = .
CHAMPSIM_DIR = %(ROOT_DIR)s/ChampSim
TRACE_DIR = %(ROOT_DIR)s/traces
DUMP_DIR = %(ROOT_DIR)s/data
STATS_DIR = %(ROOT_DIR)s/stats
FIGURES_DIR = %(ROOT_DIR)s/figures 
SLIDES_DIR = %(ROOT_DIR)s/slides

[SIMULATION]
warmup_instructions = 50000000
run_instructions = 100000000
time = 02:00:00
batch_size = 20

[PARSING]
parse_raw_stats = true
parse_reuse_distance_stats = false

[PLOTTING]
plot_name = txvc_prefetch_eval_unlimited
plot_type = ipc, txvc_prefetcher_survivability, txvc_prefetch_failure_split, txvc_prefetch_funnel
file_type = png
alternative_tags = BASELINE, None, Stride, Sibling, Child

[EXPERIMENT]
name = txvc_prefetch_eval
workload = selected_qualcomm_srv_ap
#workload = google_srv
#workload = spec_cpu_2017
#workload = gapp
#workload = debug
#workload = test
debug_run = false
parallel_run = true
simulations_base = BASELINE
simulations_txvc_64KB = TXVC_64KB_pf-none_missft-${txvc.miss_fill_target}_prefetchft_${txvc.prefetch_fill_target}
simulations_txvc_64KB_stride_pf = TXVC_64KB_pf-stride_missft-${txvc.miss_fill_target}_prefetchft_${txvc.prefetch_fill_target}_gate-${txvc.pf_mshr_gate_pct}_thld-${txvc.pf_stride_conf_threshold}_tblsize-${txvc.pf_stride_table_size}
simulations_txvc_64KB_sblg_pf = TXVC_64KB_pf-sblg_missft-${txvc.miss_fill_target}_prefetchft_${txvc.prefetch_fill_target}_gate-${txvc.pf_mshr_gate_pct}_thld-${txvc.pf_sblg_conf_threshold}_tblsize-${txvc.pf_sblg_table_size}_degree-${txvc.pf_sblg_degree}_accthld-${txvc.pf_sblg_acc_threshold}_accwindow-${txvc.pf_sblg_acc_window}
simulations_txvc_64KB_child_pf = TXVC_64KB_pf-child_missft-${txvc.miss_fill_target}_prefetchft_${txvc.prefetch_fill_target}_gate-${txvc.pf_mshr_gate_pct}_thld-${txvc.pf_child_conf_threshold}_tblsz-${txvc.pf_child_table_size}_pendingsz-${txvc.pf_child_pending_size}
# SIMULATIONS TO ACTUALLY RUN
#simulations = %(simulations_base)s, %(simulations_txvc_64KB)s, %(simulations_txvc_128KB)s
simulations = %(simulations_base)s, %(simulations_txvc_64KB)s, %(simulations_txvc_64KB_stride_pf)s, %(simulations_txvc_64KB_sblg_pf)s, %(simulations_txvc_64KB_child_pf)s
#simulations = %(simulations_txvc_64KB_child_pf)s

