txvc.ways = 4096
#txvc.ways = 512 1024 2048 4096
txvc.cache_filtering = true
#txvc.cache_filter = none simple-freq-filter freq-filter bloom-freq-filter oracle-mfu beladyOPT-set
txvc.cache_filter = none freq-filter
txvc.filter_mem_trace_path = ./data/txvc_l2c_traces
