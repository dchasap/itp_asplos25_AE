txvc.replacement = lfu


[iTP+xPTP-L2C-SETS-${l2c.sets}-WAYS-${l2c.ways}-TXVC-SETS-1-WAYS-${txvc.ways}-FILTER-${txvc.cache_filter}-REP-${txvc.replacement}]
