stlb.replacement = itp
#l2c.sets = 1024 
l2c.sets = 2048
l2c.ways = 8
l2c.replacement = xptp
llc.sets = 1537
llc.ways = 16


[L2C-SETS-${l2c.sets}-WAYS-${l2c.ways}-TXVC-SETS-1-WAYS-${txvc.ways}-FILTER-${txvc.cache_filter}-REP-${txvc.replacement}]
ooo_cpu.instruction_prefetcher = fdip
#l2c.sets = 1024
l2c.sets = 2048
l2c.ways = 8
