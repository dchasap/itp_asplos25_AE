[BASE]
ROOT_DIR = .
CHAMPSIM_DIR = %(ROOT_DIR)s/ChampSim
TRACE_DIR = %(ROOT_DIR)s/traces
DUMP_DIR = %(ROOT_DIR)s/data
STATS_DIR = %(ROOT_DIR)s/stats
FIGURES_DIR = %(ROOT_DIR)s/figures 

[SIMULATION]
warmup_instructions = 50000000
run_instructions = 100000000
time = 04:00:00
batch_size = 5

[PARSING]
parse_raw_stats = true
parse_reuse_distance_stats = false

[PLOTTING]
plot_name = fig_doa_cntr_size_analysis-inf-predtable_nobias
#plot_name = fig_doa_cntr_size_analysis-inf-predtable
#plot_name = fig_doa2_cntr_size_analysis-inf-predtable_nobias
plot_type = plot_ipc
file_type = pdf
# TODO: add aliasing for tag names
# sim_tags= ...Alternative names for sim, should match order and...

[EXPERIMENT]
name = doa_cntr_size_analysis_inf-predtable_nobias
#name = doa_cntr_size_analysis_inf-predtable
#name = doa2_cntr_size_analysis_inf-predtable_nobias
workload = selected_qualcomm_srv_ap
#workload = smt_qualcomm_srv_ap
#workload = debug
debug_run = false
#simulations=BASELINE, TXVC-4KB_DOA-CNTR_SZ-2, TXVC-4KB_DOA-CNTR_SZ-3, TXVC-4KB_DOA-CNTR_SZ-4, TXVC-8KB_DOA-CNTR_SZ-2, TXVC-8KB_DOA-CNTR_SZ-3, TXVC-8KB_DOA-CNTR_SZ-4, TXVC-32KB_DOA-CNTR_SZ-2, TXVC-32KB_DOA-CNTR_SZ-3, TXVC-32KB_DOA-CNTR_SZ-4
simulations_base = BASELINE
simulations_4KB = TXVC-4KB, TXVC-4KB_DOA-CNTR_SZ-2, TXVC-4KB_DOA-CNTR_SZ-3, TXVC-4KB_DOA-CNTR_SZ-4 
simulations_32KB = TXVC-32KB, TXVC-32KB_DOA-CNTR_SZ-2, TXVC-32KB_DOA-CNTR_SZ-3, TXVC-32KB_DOA-CNTR_SZ-4
simulations_4KB_doa = TXVC-4KB_DOA-CNTR_SZ-2, TXVC-4KB_DOA-CNTR_SZ-3, TXVC-4KB_DOA-CNTR_SZ-4 
simulations_32KB_doa = TXVC-32KB_DOA-CNTR_SZ-2, TXVC-32KB_DOA-CNTR_SZ-3, TXVC-32KB_DOA-CNTR_SZ-4
#simulations = %(simulations_base)s, %(simulations_4KB)s, %(simulations_32KB)s
simulations = %(simulations_4KB_doa)s, %(simulations_32KB_doa)s
#simulations = TXVC-32KB_DOA-CNTR_SZ-4

[BASELINE]
skip_simulation = true
simulation_stats = ./stats/txvc_base_eval/BASELINE/selected_qualcomm_srv_ap_BASELINE.csv
ooo_cpu.instruction_prefetcher = fdip
llc.sets = 1537
llc.ways = 16

