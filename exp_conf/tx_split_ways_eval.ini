[BASE]
ROOT_DIR = .
CHAMPSIM_DIR = %(ROOT_DIR)s/ChampSim
TRACE_DIR = %(ROOT_DIR)s/traces
DUMP_DIR = %(ROOT_DIR)s/data
STATS_DIR = %(ROOT_DIR)s/stats
FIGURES_DIR = %(ROOT_DIR)s/figures 
SLIDES_DIR = %(ROOT_DIR)s/slides

[SIMULATION]
warmup_instructions = 50000000
run_instructions = 100000000
time = 02:00:00
batch_size = 20

[PARSING]
parse_raw_stats = true
parse_reuse_distance_stats = false

[PLOTTING]
plot_name = txvc_l2c_llc_size_eval
plot_type = ipc, mpki
file_type = pdf
#alternative_tags = 

[EXPERIMENT]
name = tx_split_ways_eval
#workload = qualcomm_srv_ap
workload = selected_qualcomm_srv_ap
#workload = google_srv
#workload = spec_cpu_2017
#workload = gapp
#workload = debug
debug_run = false
parallel_run = true
simulations_base = BASELINE-L2C-${l2c.sets}-${l2c.ways}-LLC-${llc.sets}-${llc.ways}
simulations_txvc = TX_SPLIT_WAYS_128KB-L2C-${l2c.sets}-${l2c.ways}-LLC-${llc.sets}-${llc.ways}

# SIMULATIONS TO ACTUALLY RUN
#simulations = %(simulations_base)s, %(simulations_txvc)s
simulations = TX_SPLIT_WAYS_128KB-L2C-${l2c.sets}-${l2c.ways}-LLC-${llc.sets}-${llc.ways}
#simulations = TXVC-128KB-L2C-${l2c.sets}-${l2c.ways}-LLC-${llc.sets}-${llc.ways}-FILTER-${txvc.cache_filter}

[BASELINE-L2C-${l2c.sets}-${l2c.ways}-LLC-${llc.sets}-${llc.ways}]
ooo_cpu.instruction_prefetcher = fdip
l2c.sets = 4096
#l2c.sets = 2048 4096
l2c.ways = 8
#llc.sets = 1024 1536 2048
llc.sets = 2048 
llc.ways = 16

[TX_SPLIT_WAYS_128KB-L2C-${l2c.sets}-${l2c.ways}-LLC-${llc.sets}-${llc.ways}]
ooo_cpu.instruction_prefetcher = fdip
#l2c.sets = 2048 2560 3072 3584 4096
l2c.sets = 4096
l2c.ways = 8
#llc.sets = 1024 1280 1536 1792 2048
llc.sets = 2048
llc.ways = 16
ooo_cpu.enable_txvc = true
tx.split_ways = 1

