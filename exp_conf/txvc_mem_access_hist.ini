[BASE]
ROOT_DIR = .
CHAMPSIM_DIR = %(ROOT_DIR)s/ChampSim
TRACE_DIR = %(ROOT_DIR)s/traces
DUMP_DIR = %(ROOT_DIR)s/data
STATS_DIR = %(ROOT_DIR)s/stats
FIGURES_DIR = %(ROOT_DIR)s/figures 

[SIMULATION]
warmup_instructions = 50000000
run_instructions = 100000000
time = 02:00:00
batch_size = 20

[PARSING]
parse_raw_stats = true
parse_reuse_distance_stats = false

[PLOTTING]
plot_name = miss_rate
plot_type = miss_rate
file_type = pdf

[EXPERIMENT]
name = txvc_mem_access
#workload = selected_qualcomm_srv_ap
workload = google_srv
debug_run = false
parallel_run = true
simulations = TXVC-64KB, TXVC-128KB


[TXVC-64KB]
ooo_cpu.instruction_prefetcher = fdip
l2c.sets = 2048
l2c.ways = 8
llc.sets = 1024
llc.ways = 16
ooo_cpu.enable_txvc = true
txvc.level = 2
txvc.sets = 64
txvc.ways = 16
txvc.set_indexer = default
txvc.cache_filtering = true
txvc.cache_filter = freq-filter
txvc.filter_frequency_threshold = 2
txvc.replacement = lfu
txvc.mem_access_trace = ./data/txvc_mem_access

[TXVC-128KB]
ooo_cpu.instruction_prefetcher = fdip
l2c.sets = 2048
l2c.ways = 8
llc.sets = 1024
llc.ways = 16
ooo_cpu.enable_txvc = true
txvc.level = 2
txvc.sets = 128
txvc.ways = 16
txvc.set_indexer = default
txvc.cache_filtering = true
txvc.cache_filter = freq-filter
txvc.filter_frequency_threshold = 2
txvc.replacement = lfu
txvc.mem_access_trace = ./data/txvc_mem_access
